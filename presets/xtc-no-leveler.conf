# x20-speaker-dsp preset: xtc-no-leveler
# Like xtc, but without the volume leveler (dynamics untouched except fast compressor + limiters).
# Installed by install.sh; @SPEAKER_SINK@ is replaced with your speaker sink.
# Chain built with help from speaker-tuning-to-easyeffects (MIT); see NOTICE.md.

